<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <script>
        // Redirect clean URLs to their corresponding .html files
        const path = window.location.pathname;
        const newPath = path.endsWith('/') ? `${path}index.html` : `${path}.html`;
        window.location.replace(newPath);
    </script>
</head>
<body>
    <h1>Redirecting...</h1>
</body>
</html>
