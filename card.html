<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GusWorks — Business Card</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #04040a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* ── Starfield ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(1px   1px   at 12% 18%, rgba(255,255,255,0.65) 0%, transparent 100%),
                radial-gradient(1px   1px   at 87%  8%, rgba(255,255,255,0.55) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 52% 65%, rgba(255,255,255,0.6)  0%, transparent 100%),
                radial-gradient(1px   1px   at  6% 82%, rgba(255,255,255,0.4)  0%, transparent 100%),
                radial-gradient(1px   1px   at 94% 52%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1px   1px   at 32% 10%, rgba(255,255,255,0.38) 0%, transparent 100%),
                radial-gradient(2px   2px   at 65% 90%, rgba(255,255,255,0.28) 0%, transparent 100%),
                radial-gradient(1px   1px   at 74% 35%, rgba(255,255,255,0.42) 0%, transparent 100%),
                radial-gradient(1px   1px   at 42% 92%, rgba(255,255,255,0.3)  0%, transparent 100%),
                radial-gradient(1px   1px   at 20% 58%, rgba(255,255,255,0.32) 0%, transparent 100%),
                radial-gradient(1px   1px   at 60% 25%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1px   1px   at  3% 45%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px   1px   at 78% 72%, rgba(255,255,255,0.22) 0%, transparent 100%),
                radial-gradient(1px   1px   at 47% 40%, rgba(255,255,255,0.2)  0%, transparent 100%),
                radial-gradient(1px   1px   at 15% 95%, rgba(255,255,255,0.24) 0%, transparent 100%),
                radial-gradient(1px   1px   at 91% 30%, rgba(255,255,255,0.3)  0%, transparent 100%),
                radial-gradient(2px   2px   at 35% 75%, rgba(255,255,255,0.17) 0%, transparent 100%),
                radial-gradient(1px   1px   at 58%  5%, rgba(255,255,255,0.38) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Ambient haze ── */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(61,90,254,0.09) 0%, transparent 65%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Scene ── */
        .scene {
            perspective: 1400px;
            perspective-origin: 50% 50%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Float wrapper ── */
        .float {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%,  100% { transform: translateY(0px); }
            50%        { transform: translateY(-28px); }
        }

        /* ── Glow shadow beneath card ── */
        .card-glow {
            width: 620px;
            height: 22px;
            margin-top: 10px;
            background: radial-gradient(ellipse at center, rgba(61,90,254,0.55) 0%, transparent 70%);
            filter: blur(16px);
            pointer-events: none;
            opacity: 0.75;
            transform: scaleY(0.6);
        }

        /* ── Spin wrapper ── */
        .spinner {
            width: 760px;
            height: 212px;
            position: relative;
            transform-style: preserve-3d;
            /* spin is driven by JS; only the glow pulse stays in CSS */
            animation: pulse 4s ease-in-out infinite alternate;
            cursor: grab;
        }

        .spinner:active {
            cursor: grabbing;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 18px rgba(61,90,254,0.12), 0 0 40px rgba(61,90,254,0.06), 0 0 1px rgba(61,90,254,0.5); }
            100% { box-shadow: 0 0 32px rgba(61,90,254,0.28), 0 0 80px rgba(61,90,254,0.14), 0 0 2px rgba(61,90,254,0.9); }
        }

        /* ── Card faces ── */
        .face {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        /* ════════════════════════════════════════
           FRONT
        ════════════════════════════════════════ */
        .front {
            background: #07070c;
            border: 1px solid rgba(61,90,254,0.18);
            display: grid;
            grid-template-columns: 148px 1fr 214px;
        }

        /* Ghost "GW" watermark */
        .front::before {
            content: 'GW';
            position: absolute;
            font-size: 240px;
            font-weight: 900;
            font-style: italic;
            color: rgba(61,90,254,0.032);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            letter-spacing: -0.04em;
            white-space: nowrap;
            z-index: 0;
            user-select: none;
        }

        /* Holographic shimmer overlay — position driven by JS --mx/--my */
        .front::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse 55% 80% at var(--mx, 50%) var(--my, -20%),
                rgba(130,170,255,0.11) 0%,
                rgba(61,90,254,0.06)  40%,
                transparent           70%
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Bottom neon line */
        .front-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(
                to right,
                transparent                  0%,
                rgba(61,90,254,0)            8%,
                rgba(61,90,254,0.55)        30%,
                rgba(160,195,255,0.9)       50%,
                rgba(61,90,254,0.55)        70%,
                rgba(61,90,254,0)           92%,
                transparent                 100%
            );
            z-index: 3;
            animation: barGlow 2.8s ease-in-out infinite alternate;
        }

        @keyframes barGlow {
            0%   { opacity: 0.45; }
            100% { opacity: 1; }
        }

        /* ── Logo column ── */
        .logo-col {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 26px 20px;
            border-right: 1px solid rgba(61,90,254,0.07);
        }

        .logo-slot {
            width: 84px;
            height: 84px;
            border: 1px solid rgba(61,90,254,0.32);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Corner tick marks */
        .logo-slot::before,
        .logo-slot::after {
            content: '';
            position: absolute;
            width: 11px;
            height: 11px;
            border-color: #3d5afe;
            border-style: solid;
        }
        .logo-slot::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
            border-radius: 3px 0 0 0;
        }
        .logo-slot::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
            border-radius: 0 0 3px 0;
        }

        .logo-slot img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .logo-slot-label {
            font-size: 7px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(61,90,254,0.38);
        }

        /* ── Name column ── */
        .name-col {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 30px;
            gap: 9px;
        }

        .artist-tag {
            font-size: 7px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #3d5afe;
            opacity: 0.8;
        }

        .full-name {
            font-size: 14px;
            font-weight: 600;
            color: #ccccd8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.5;
        }

        .divider-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #3d5afe;
            flex-shrink: 0;
        }

        .divider-line {
            height: 1px;
            flex: 1;
            background: linear-gradient(to right, rgba(61,90,254,0.45), transparent);
        }

        .sub-title {
            font-size: 7.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #444;
        }

        /* ── Contact column ── */
        .contact-col {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 22px;
            gap: 9px;
            border-left: 1px solid rgba(61,90,254,0.07);
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .contact-label {
            font-size: 6px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #3d5afe;
            opacity: 0.7;
        }

        .contact-item a {
            font-size: 8.5px;
            color: #606070;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: color 0.2s;
        }

        .contact-item a:hover {
            color: #bbbbc8;
        }

        /* ════════════════════════════════════════
           BACK
        ════════════════════════════════════════ */
        .back {
            transform: rotateY(180deg);
            background: #06060c;
            border: 1px solid rgba(61,90,254,0.14);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 7px;
            position: relative;
        }

        /* Diagonal ghost text */
        .back::before {
            content: 'GUSWORKS';
            position: absolute;
            font-size: 88px;
            font-weight: 900;
            font-style: italic;
            color: rgba(61,90,254,0.055);
            white-space: nowrap;
            transform: rotate(-10deg);
            letter-spacing: 0.06em;
            pointer-events: none;
            user-select: none;
        }

        /* Bottom neon line (mirrors front) */
        .back::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(
                to right,
                transparent                 0%,
                rgba(61,90,254,0)           8%,
                rgba(61,90,254,0.55)       30%,
                rgba(160,195,255,0.9)      50%,
                rgba(61,90,254,0.55)       70%,
                rgba(61,90,254,0)          92%,
                transparent                100%
            );
            animation: barGlow 2.8s ease-in-out infinite alternate;
        }

        .back-rule {
            position: relative;
            z-index: 1;
            width: 64px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(61,90,254,0.75), transparent);
        }

        .back-brand {
            position: relative;
            z-index: 1;
            font-size: 50px;
            font-weight: 200;
            font-style: italic;
            color: #fff;
            letter-spacing: 0.08em;
            text-shadow:
                0 0 28px rgba(61,90,254,0.7),
                0 0 70px rgba(61,90,254,0.25);
        }

        .back-url {
            position: relative;
            z-index: 1;
            font-size: 8px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.28);
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .spinner    { width: 560px; height: 156px; }
            .front      { grid-template-columns: 110px 1fr 160px; }
            .logo-col   { padding: 20px 14px; }
            .logo-slot  { width: 62px; height: 62px; }
            .name-col   { padding: 20px 22px; gap: 7px; }
            .full-name  { font-size: 11px; }
            .contact-col { padding: 20px 16px; gap: 7px; }
            .contact-item a { font-size: 7px; }
            .back-brand { font-size: 38px; }
            .card-glow  { width: 450px; }
        }

        @media (max-width: 580px) {
            .spinner    { width: 340px; height: 95px; }
            .front      { grid-template-columns: 70px 1fr 110px; }
            .logo-col   { padding: 10px 8px; }
            .logo-slot  { width: 40px; height: 40px; border-radius: 7px; }
            .name-col   { padding: 10px 12px; gap: 4px; }
            .full-name  { font-size: 7.5px; letter-spacing: 0.06em; }
            .artist-tag { font-size: 5px; }
            .sub-title  { font-size: 5.5px; }
            .contact-col { padding: 10px 10px; gap: 5px; }
            .contact-item a { font-size: 5.5px; }
            .contact-label { font-size: 4.5px; }
            .back-brand { font-size: 24px; }
            .back-url   { font-size: 5.5px; letter-spacing: 0.18em; }
            .card-glow  { width: 260px; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="float">

            <div class="spinner" id="spinner">

                <!-- ── Front ── -->
                <div class="face front" id="front">
                    <div class="front-bar"></div>

                    <div class="logo-col">
                        <div class="logo-slot">
                            <!-- Place your logo here: <img src="assets/logo.png" alt="GusWorks logo"> -->
                            <span class="logo-slot-label">Logo</span>
                        </div>
                    </div>

                    <div class="name-col">
                        <span class="artist-tag">GusWorks</span>
                        <div class="full-name">Gustavo Henrique<br>Costa Araújo</div>
                        <div class="divider-row">
                            <div class="divider-dot"></div>
                            <div class="divider-line"></div>
                        </div>
                        <div class="sub-title">Creative Artist</div>
                    </div>

                    <div class="contact-col">
                        <div class="contact-item">
                            <span class="contact-label">Web</span>
                            <a href="https://gustavoworks.com" target="_blank">gustavoworks.com</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Instagram</span>
                            <a href="https://www.instagram.com/____gusworks____" target="_blank">@____gusworks____</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Email</span>
                            <a href="mailto:info@gustavoworks.com">info@gustavoworks.com</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Tel</span>
                            <a href="tel:+123456789">+123456789</a>
                        </div>
                    </div>
                </div>

                <!-- ── Back ── -->
                <div class="face back">
                    <div class="back-rule"></div>
                    <div class="back-brand">GusWorks</div>
                    <div class="back-url">gustavoworks.com</div>
                    <div class="back-rule"></div>
                </div>

            </div><!-- /.spinner -->

            <div class="card-glow"></div>
        </div><!-- /.float -->
    </div><!-- /.scene -->

    <script>
        var spinner = document.getElementById('spinner');
        var front   = document.getElementById('front');

        // ── Rotation state ──────────────────────────────────────────────────
        // One full rotation every 26 s at 60 fps
        var AUTO_VEL = 360 / (26 * 60); // ≈ 0.231 deg / frame

        var rotY = 0;      // current Y rotation (spin axis)
        var rotX = 0;      // current X rotation (tilt axis)
        var velY = AUTO_VEL; // current Y angular velocity
        var velX = 0;        // current X angular velocity

        // ── Drag state ──────────────────────────────────────────────────────
        var dragging = false;
        var lastX = 0, lastY = 0;
        var dragVelY = 0, dragVelX = 0; // smoothed drag delta per frame

        // ── rAF loop ────────────────────────────────────────────────────────
        function tick() {
            if (dragging) {
                // While dragging: velocity = smoothed pointer delta
                velY = dragVelY;
                velX = dragVelX;
                // Reset deltas each frame (populated by pointermove)
                dragVelY = 0;
                dragVelX = 0;
            } else {
                // Ease Y velocity back to auto-spin speed (feels like magnetic catch)
                velY += (AUTO_VEL - velY) * 0.032;
                // X velocity and tilt both decay to zero
                velX *= 0.85;
                rotX *= 0.90;
            }

            rotY += velY;
            rotX  = Math.max(-50, Math.min(50, rotX + velX));

            spinner.style.transform =
                'rotateY(' + rotY + 'deg) rotateX(' + rotX + 'deg)';

            requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);

        // ── Pointer events (mouse + touch via Pointer API) ──────────────────
        spinner.addEventListener('pointerdown', function (e) {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            dragVelY = 0;
            dragVelX = 0;
            spinner.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        spinner.addEventListener('pointermove', function (e) {
            // Always update shimmer (hover highlight)
            var rect = spinner.getBoundingClientRect();
            if (rect.width > 0) {
                front.style.setProperty('--mx',
                    ((e.clientX - rect.left) / rect.width  * 100).toFixed(1) + '%');
                front.style.setProperty('--my',
                    ((e.clientY - rect.top)  / rect.height * 100).toFixed(1) + '%');
            }

            if (!dragging) return;

            var dx = e.clientX - lastX;
            var dy = e.clientY - lastY;

            // Accumulate drag delta; rAF loop reads & resets each frame
            dragVelY += dx * 0.55;
            dragVelX += -dy * 0.35;

            lastX = e.clientX;
            lastY = e.clientY;
        });

        spinner.addEventListener('pointerup',     function () { dragging = false; });
        spinner.addEventListener('pointercancel', function () { dragging = false; });

        // Reset shimmer to centre when cursor leaves
        spinner.addEventListener('pointerleave', function (e) {
            if (e.pointerType === 'mouse' && !dragging) {
                front.style.setProperty('--mx', '50%');
                front.style.setProperty('--my', '-20%');
            }
        });
    </script>
</body>
</html>
