<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GusWorks — Business Card</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #060608;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* ── Starfield ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(1px   1px   at 15% 20%, rgba(255,255,255,0.55) 0%, transparent 100%),
                radial-gradient(1px   1px   at 85% 10%, rgba(255,255,255,0.45) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 50% 62%, rgba(255,255,255,0.5)  0%, transparent 100%),
                radial-gradient(1px   1px   at  8% 80%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px   1px   at 92% 55%, rgba(255,255,255,0.4)  0%, transparent 100%),
                radial-gradient(1px   1px   at 30% 12%, rgba(255,255,255,0.3)  0%, transparent 100%),
                radial-gradient(2px   2px   at 68% 88%, rgba(255,255,255,0.22) 0%, transparent 100%),
                radial-gradient(1px   1px   at 72% 38%, rgba(255,255,255,0.35) 0%, transparent 100%),
                radial-gradient(1px   1px   at 40% 90%, rgba(255,255,255,0.25) 0%, transparent 100%),
                radial-gradient(1px   1px   at 22% 55%, rgba(255,255,255,0.28) 0%, transparent 100%),
                radial-gradient(1px   1px   at 58% 28%, rgba(255,255,255,0.2)  0%, transparent 100%),
                radial-gradient(1px   1px   at  5% 42%, rgba(255,255,255,0.3)  0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Ambient glow beneath ── */
        body::after {
            content: '';
            position: fixed;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(61,90,254,0.18) 0%, transparent 70%);
            filter: blur(24px);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Scene ── */
        .scene {
            perspective: 1100px;
            perspective-origin: 50% 50%;
            z-index: 1;
        }

        /* ── Float wrapper (up/down only) ── */
        .float {
            animation: float 4.5s ease-in-out infinite;
        }

        @keyframes float {
            0%,  100% { transform: translateY(0px); }
            50%        { transform: translateY(-22px); }
        }

        /* ── Glow shadow that floats with the card ── */
        .card-glow {
            width: 400px;
            height: 28px;
            margin: 0 auto 0;
            background: radial-gradient(ellipse at center, rgba(61,90,254,0.38) 0%, transparent 70%);
            filter: blur(12px);
            pointer-events: none;
            transform: scaleY(0.5);
        }

        /* ── Spin wrapper ── */
        .spinner {
            width: 540px;
            height: 310px;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 11s linear infinite;
            cursor: pointer;
        }

        .spinner.paused {
            animation-play-state: paused;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }

        /* ── Card faces ── */
        .face {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        /* ════════════════ FRONT ════════════════ */
        .front {
            background: #0d0d10;
            border: 1px solid rgba(61,90,254,0.22);
            display: grid;
            grid-template-columns: 210px 1fr;
        }

        /* Left column — logo + artist name */
        .logo-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 28px;
            border-right: 1px solid rgba(61,90,254,0.1);
        }

        .logo-slot {
            width: 96px;
            height: 96px;
            border: 1.5px dashed rgba(61,90,254,0.45);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-slot img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            object-fit: contain;
        }

        .logo-slot-label {
            font-size: 8.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(61,90,254,0.45);
        }

        .artist-name {
            font-size: 13px;
            font-weight: 300;
            font-style: italic;
            color: rgba(61,90,254,0.75);
            letter-spacing: 0.1em;
        }

        /* Right column — name + contacts */
        .info-col {
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 11px;
        }

        .full-name {
            font-size: 11px;
            font-weight: 500;
            color: #c8c8c8;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            line-height: 1.6;
        }

        .accent-line {
            width: 30px;
            height: 1px;
            background: linear-gradient(to right, #3d5afe, transparent);
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-row {
            display: flex;
            align-items: baseline;
            gap: 9px;
        }

        .contact-label {
            font-size: 7.5px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #3d5afe;
            min-width: 22px;
            opacity: 0.85;
        }

        .contact-row a {
            font-size: 9px;
            color: #777;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: color 0.2s;
        }

        .contact-row a:hover {
            color: #c8c8c8;
        }

        /* ════════════════ BACK ════════════════ */
        .back {
            background: #3d5afe;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 22px 22px;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .back-rule {
            width: 52px;
            height: 1px;
            background: rgba(255,255,255,0.35);
        }

        .back-brand {
            font-size: 46px;
            font-weight: 200;
            font-style: italic;
            color: #fff;
            letter-spacing: 0.06em;
        }

        .back-url {
            font-size: 9.5px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
        }

        /* ── Responsive (tablet / mobile) ── */
        @media (max-width: 620px) {
            .spinner {
                width: 320px;
                height: 184px;
            }
            .front { grid-template-columns: 120px 1fr; }
            .logo-col { padding: 16px; gap: 8px; }
            .logo-slot { width: 60px; height: 60px; }
            .artist-name { font-size: 10px; }
            .info-col { padding: 16px 14px; gap: 7px; }
            .full-name { font-size: 8px; }
            .contact-row a { font-size: 7px; }
            .contact-label { font-size: 6px; }
            .back-brand { font-size: 28px; }
            .back-url { font-size: 7.5px; }
            .card-glow { width: 240px; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="float">
            <!-- Glow floats with the card -->
            <div class="card-glow"></div>

            <!-- Spinning card -->
            <div class="spinner" id="spinner">

                <!-- ── Front ── -->
                <div class="face front">
                    <div class="logo-col">
                        <div class="logo-slot">
                            <!-- Drop your logo image here: <img src="assets/logo.png" alt="GusWorks logo"> -->
                            <span class="logo-slot-label">Logo</span>
                        </div>
                        <div class="artist-name">GusWorks</div>
                    </div>

                    <div class="info-col">
                        <div class="full-name">Gustavo Henrique<br>Costa Araújo</div>
                        <div class="accent-line"></div>
                        <div class="contact-list">
                            <div class="contact-row">
                                <span class="contact-label">web</span>
                                <a href="https://gustavoworks.com" target="_blank">gustavoworks.com</a>
                            </div>
                            <div class="contact-row">
                                <span class="contact-label">ig</span>
                                <a href="https://www.instagram.com/____gusworks____" target="_blank">@____gusworks____</a>
                            </div>
                            <div class="contact-row">
                                <span class="contact-label">em</span>
                                <a href="mailto:info@gustavoworks.com">info@gustavoworks.com</a>
                            </div>
                            <div class="contact-row">
                                <span class="contact-label">tel</span>
                                <a href="tel:+123456789">+123456789</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Back ── -->
                <div class="face back">
                    <div class="back-rule"></div>
                    <div class="back-brand">GusWorks</div>
                    <div class="back-url">gustavoworks.com</div>
                    <div class="back-rule"></div>
                </div>

            </div><!-- /.spinner -->
        </div><!-- /.float -->
    </div><!-- /.scene -->

    <script>
        var spinner = document.getElementById('spinner');
        var hovering = false;

        spinner.addEventListener('mouseenter', function () {
            hovering = true;
            spinner.classList.add('paused');
        });

        spinner.addEventListener('mouseleave', function () {
            hovering = false;
            spinner.classList.remove('paused');
            spinner.style.transform = '';
        });

        document.addEventListener('mousemove', function (e) {
            if (!hovering) return;
            var rect = spinner.getBoundingClientRect();
            var cx = rect.left + rect.width  / 2;
            var cy = rect.top  + rect.height / 2;
            var dx = (e.clientX - cx) / (rect.width  / 2);
            var dy = (e.clientY - cy) / (rect.height / 2);
            spinner.style.transform =
                'rotateY(' + (dx * 28) + 'deg) rotateX(' + (-dy * 16) + 'deg)';
        });
    </script>
</body>
</html>
