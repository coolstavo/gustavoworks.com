<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__--eqf worKS __{}</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" type="text/css" href="/assets/stylesheet/works.css">
    <link rel="stylesheet" href="/assets/stylesheet/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="container">
    
    <nav class="nav-bar">
        <a href="index.html">home</a> <span class="separator">|</span>
        <a href="works.html" class="active">works</a> <span class="separator">|</span>
        <a href="about.html">about</a>
    </nav>

    <div class="title">
        wrk
    </div>

    <!-- Main content: terminal info + mosaic gallery -->
    <div class="works-main">

        <div class="terminal-window">
            <div class="terminal-header">
                <span class="terminal-btn btn-red"></span>
                <span class="terminal-btn btn-yellow"></span>
                <span class="terminal-btn btn-green"></span>
                <span class="terminal-title-bar">gustavoworks.com — bash</span>
            </div>
            <div class="terminal-body">
                <div class="content">
                    <div class="prompt-line">
                        <span class="prompt" aria-hidden="true">$</span>
                        <span class="cmd">ls ./works</span>
                    </div>
                    <p class="output">THIS PAGE WILL BE AVAILABLE SOON! :))<span class="cursor" aria-hidden="true"></span></p>
                    <br>
                    <div class="prompt-line">
                        <span class="prompt" aria-hidden="true">$</span>
                        <span class="cmd">contact</span>
                    </div>
                    <p class="output">&gt; Go to the <a href="about.html">./about</a> page.</p>
                    <p class="output">&gt; Or find me on Instagram <a href="https://www.instagram.com/____gusworks____" target="_blank">@____gusworks____</a></p>
                </div>
            </div>
        </div>

        <!-- Auto-scrolling mosaic gallery -->
        <!-- To use real artwork: set each .mosaic-tile background-image to your image URL -->
        <section class="mosaic-gallery" aria-label="Artwork gallery">
            <p class="mosaic-label" aria-hidden="true">$ ls --gallery</p>

            <!-- Row 1 — scrolls left -->
            <div class="mosaic-row mosaic-row--left">
                <div class="mosaic-tile t1"></div>
                <div class="mosaic-tile t2"></div>
                <div class="mosaic-tile t3"></div>
                <div class="mosaic-tile t4"></div>
                <div class="mosaic-tile t5"></div>
                <div class="mosaic-tile t6"></div>
                <div class="mosaic-tile t7"></div>
                <div class="mosaic-tile t8"></div>
                <!-- duplicate set for seamless loop -->
                <div class="mosaic-tile t1" aria-hidden="true"></div>
                <div class="mosaic-tile t2" aria-hidden="true"></div>
                <div class="mosaic-tile t3" aria-hidden="true"></div>
                <div class="mosaic-tile t4" aria-hidden="true"></div>
                <div class="mosaic-tile t5" aria-hidden="true"></div>
                <div class="mosaic-tile t6" aria-hidden="true"></div>
                <div class="mosaic-tile t7" aria-hidden="true"></div>
                <div class="mosaic-tile t8" aria-hidden="true"></div>
            </div>

            <!-- Row 2 — scrolls right (reversed order for visual variety) -->
            <div class="mosaic-row mosaic-row--right">
                <div class="mosaic-tile t5"></div>
                <div class="mosaic-tile t8"></div>
                <div class="mosaic-tile t3"></div>
                <div class="mosaic-tile t6"></div>
                <div class="mosaic-tile t1"></div>
                <div class="mosaic-tile t7"></div>
                <div class="mosaic-tile t2"></div>
                <div class="mosaic-tile t4"></div>
                <!-- duplicate set -->
                <div class="mosaic-tile t5" aria-hidden="true"></div>
                <div class="mosaic-tile t8" aria-hidden="true"></div>
                <div class="mosaic-tile t3" aria-hidden="true"></div>
                <div class="mosaic-tile t6" aria-hidden="true"></div>
                <div class="mosaic-tile t1" aria-hidden="true"></div>
                <div class="mosaic-tile t7" aria-hidden="true"></div>
                <div class="mosaic-tile t2" aria-hidden="true"></div>
                <div class="mosaic-tile t4" aria-hidden="true"></div>
            </div>
        </section>

    </div><!-- /.works-main -->

    <footer class="footer">
        <div class="footer-content">
          <div class="social-links">
            <a href="https://www.instagram.com/____gusworks____" target="_blank" class="social-icon">
              <i class="fab fa-instagram"></i>
            </a>
            <a href="mailto:info@gustavoworks.com" class="social-icon">
              <i class="far fa-envelope"></i>
            </a>
          </div>
          <p>© 2025, Gustavo Henrique Costa Araújo</p>
        </div>
      </footer>

</body>

</html>
